# Grok Build using Gemini on GCP project shutterstock-asset-processor (Vertex AI).
# Endpoint: us-central1 (stable GA).
#
# WHY 2.5, NOT 3.x: Grok is a tool-using agent. Gemini 3.x models require a
# `thought_signature` to be echoed back on every follow-up tool turn, which
# Grok does not send — so ANY multi-step tool use with 3.x returns HTTP 400.
# The 2.5 family does not require this and works end-to-end (verified 2026-07-18).
#
# TOOLS: built-in `web_search` is xAI's server-side search and is impossible
# with Gemini, so it's disabled. Real web search is provided by the DuckDuckGo
# MCP server at the bottom (`search` + `fetch_content`, no API key).
disable_web_search = true

[auth]
auth_provider_command = "~/.grok/gcp-token.sh"
auth_provider_label   = "Google Cloud (Vertex AI)"
auth_token_ttl        = 3300

[models]
default = "gemini-2.5-pro"

# Quote every [model."..."] key — dots are TOML table separators.

[model."gemini-2.5-pro"]
model          = "google/gemini-2.5-pro"
base_url       = "https://us-central1-aiplatform.googleapis.com/v1beta1/projects/shutterstock-asset-processor/locations/us-central1/endpoints/openapi"
name           = "Gemini 2.5 Pro (best quality)"
api_backend    = "chat_completions"
context_window = 1048576
max_completion_tokens = 65536

[model."gemini-2.5-flash"]
model          = "google/gemini-2.5-flash"
base_url       = "https://us-central1-aiplatform.googleapis.com/v1beta1/projects/shutterstock-asset-processor/locations/us-central1/endpoints/openapi"
name           = "Gemini 2.5 Flash (fast)"
api_backend    = "chat_completions"
context_window = 1048576
max_completion_tokens = 65536

[model."gemini-2.5-flash-lite"]
model          = "google/gemini-2.5-flash-lite"
base_url       = "https://us-central1-aiplatform.googleapis.com/v1beta1/projects/shutterstock-asset-processor/locations/us-central1/endpoints/openapi"
name           = "Gemini 2.5 Flash-Lite (cheapest)"
api_backend    = "chat_completions"
context_window = 1048576

[cli]
installer = "internal"
auto_update = false

[features]
telemetry = false

# Working web search for Gemini (keyless, DuckDuckGo). Tools: search, fetch_content.
[mcp_servers.ddg-search]
command = "uvx"
args = ["duckduckgo-mcp-server"]
